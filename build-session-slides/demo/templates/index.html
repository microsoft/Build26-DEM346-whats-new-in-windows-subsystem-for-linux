
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Image → ASCII Art</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 2rem; }
      .card { max-width: 720px; padding: 1.25rem; border: 1px solid #ddd; border-radius: 14px; }
      .row { margin: 0.75rem 0; }
      .error { color: #b00020; margin: 0.75rem 0; }
      input[type="number"] { width: 6rem; }
      button { padding: 0.6rem 1rem; border-radius: 10px; border: 1px solid #222; background: #111; color: #fff; cursor: pointer; }
      button:hover { background: #000; }
      small { color: #444; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Upload an image → ASCII art</h1>

      {% if error %}
        <div class="error"><strong>Error:</strong> {{ error }}</div>
      {% endif %}

      <!-- Flask upload form: enctype=multipart/form-data [1](https://flask.palletsprojects.com/en/stable/patterns/fileuploads/) -->
      <form action="/upload" method="post" enctype="multipart/form-data">
        <div class="row">
          <input type="file" name="file" accept="image/*" required />
        </div>

        <div class="row">
          <label>
            Columns:
            <input type="number" name="cols" min="40" max="240" value="120" />
          </label>
          <div><small>Higher = more detail (and wider output).</small></div>
        </div>

        <div class="row">
          <button type="submit">Convert</button>
        </div>
      </form>
    </div>
  </body>
</html>
